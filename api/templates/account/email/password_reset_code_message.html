{% extends "account/email/base_message.html" %}
{% block content %}
<p style="margin:0 0 16px;">Enter this code to reset your password:</p>
<p style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:8px;font-family:'Courier New',monospace;background:#f4f4f5;border-radius:12px;padding:16px;text-align:center;">{{ code }}</p>
<p style="margin:0;color:#65656c;">If you didn't ask to reset your password, you can ignore this email; your password stays the same.</p>
{% endblock content %}
