<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrailVenture</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:Helvetica,Arial,sans-serif;color:#131413;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;">
            <tr>
              <td style="padding:32px 32px 8px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:36px;height:36px;background:#14b8a6;border-radius:9px;"></td>
                    <td style="padding-left:10px;font-size:26px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;font-family:'Arial Narrow',Arial,sans-serif;">TrailVenture</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 8px;font-size:16px;line-height:1.6;">
                {% block content %}{% endblock content %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px;font-size:13px;line-height:1.5;color:#65656c;">
                TrailVenture is an early-access portfolio project. Trips are demo data and payments run in Stripe test mode.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
