[project]
name = "trailventure-api"
version = "0.1.0"
description = "TrailVenture REST API"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "cloudinary>=1.46.2",
    "django>=5.2,<6.2",
    "django-allauth[socialaccount]>=65.19.3",
    "django-anymail[mailjet]>=15.2",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
    "stripe>=15.6.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "E402"]
"**/tests/*" = ["S101", "S105", "S106"]
"conftest.py" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
