name: trailventure

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trailventure
      POSTGRES_USER: trailventure
      POSTGRES_PASSWORD: trailventure
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailventure"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Forwards Stripe test webhooks to the local API. Run with: docker compose --profile stripe up
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    command: listen --forward-to host.docker.internal:8000/api/v1/payments/stripe/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}

volumes:
  postgres-data:
