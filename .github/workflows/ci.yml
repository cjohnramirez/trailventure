name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trailventure
          POSTGRES_USER: trailventure
          POSTGRES_PASSWORD: trailventure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailventure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://trailventure:trailventure@localhost:5432/trailventure
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-insecure-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Deploy checks
        env:
          DJANGO_SECRET_KEY: ci-deploy-check-key-that-is-long-and-random-enough-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: trailventure.example
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
      - name: OpenAPI schema is valid
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml --settings=config.settings.test
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trailventure
          POSTGRES_USER: trailventure
          POSTGRES_PASSWORD: trailventure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailventure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-e2e-insecure-key
      DATABASE_URL: postgres://trailventure:trailventure@localhost:5432/trailventure
      REDIS_URL: redis://localhost:6379/0
      EMAIL_URL: smtp://localhost:1025
      API_ORIGIN: http://localhost:8000
      MAILPIT_URL: http://localhost:8025
      # Drives the specs that need a real API instead of mocked responses.
      E2E_FULL_STACK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install API dependencies
        working-directory: api
        run: uv sync --locked
      - name: Prepare the database
        working-directory: api
        run: |
          uv run python manage.py migrate
          uv run python manage.py seed_catalog
          uv run python manage.py seed_demo_users
      - name: Start the API
        working-directory: api
        run: |
          uv run python manage.py runserver 8000 --noreload > "${RUNNER_TEMP}/api.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health/ > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 2
          done
          echo "API did not start"; cat "${RUNNER_TEMP}/api.log"; exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start the web app
        working-directory: web
        run: |
          npm run start:standalone > "${RUNNER_TEMP}/web.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "web ready"
              # The hero photo is resized on first request, once per width the browser asks for.
              # Warm every default width so no test is the one paying for it.
              for w in 640 750 828 1080 1200 1920 2048 3840; do
                curl -s -o /dev/null -H "Accept: image/avif,image/webp,*/*"                   "http://localhost:3000/_next/image?url=%2Fimages%2Fhero-section.jpg&w=${w}&q=75"
              done
              exit 0
            fi
            sleep 2
          done
          echo "web app did not start"; cat "${RUNNER_TEMP}/web.log"; exit 1
      - name: End-to-end tests
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run e2e
      - name: Server logs
        if: failure()
        run: |
          echo "--- api ---"; cat "${RUNNER_TEMP}/api.log" || true
          echo "--- web ---"; cat "${RUNNER_TEMP}/web.log" || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  audit:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Python dependency audit
        working-directory: api
        run: uv export --locked --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt && uvx pip-audit --strict -r /tmp/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  # The single required status check for branch protection. Skipped jobs count as passing.
  ci-passed:
    if: always()
    needs: [api, web, e2e, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        env:
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          echo "api=$API_RESULT web=$WEB_RESULT e2e=$E2E_RESULT audit=$AUDIT_RESULT"
          for r in "$API_RESULT" "$WEB_RESULT" "$E2E_RESULT" "$AUDIT_RESULT"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
